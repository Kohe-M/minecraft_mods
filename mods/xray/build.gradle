repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// Sodium のチャンク構築にもフックするのでコンパイル時だけ参照する
	compileOnly "maven.modrinth:sodium:${sodium_version}"
	// -PnoSodium でバニラ描画のまま起動できる
	if (!project.hasProperty("noSodium")) {
		localRuntime "maven.modrinth:sodium:${sodium_version}"
		localRuntime "maven.modrinth:iris:${iris_version}"
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "xray-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}
