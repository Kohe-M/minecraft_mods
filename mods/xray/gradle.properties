mod_version=1.3.2

# 走らせるゲームテスト。ルートの build.gradle と dev.py test が読む
server_gametest=false
client_gametest=true

# 描画にフックする。dev.py test は Sodium + Iris の後に、バニラ描画（-PnoSodium）でもクライアントのゲームテストを走らせる
vanilla_render_test=true

# Distant Horizons と併用する。dev.py test は最後に DH 入り（-PdistantHorizons）で、シナリオ distant-horizons だけを走らせる
distant_horizons_test=true
