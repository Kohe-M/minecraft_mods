import java.time.Duration

import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// 同時に起動する Minecraft のクライアント（runClientGameTest）の数。
// 全 mod を一度に起動すると、どれかが起動の途中で止まることがある。-PclientSlots=N で変えられる
abstract class MinecraftClients implements BuildService<BuildServiceParameters.None> {
}

def minecraftClients = gradle.sharedServices.registerIfAbsent("minecraftClients", MinecraftClients) {
	maxParallelUsages = providers.gradleProperty("clientSlots").map { it as int }.orElse(3)
}

// 起動の途中で止まったクライアントを待ち続けない。-PclientTimeout=分 で変えられる
def clientTimeout = Duration.ofMinutes(providers.gradleProperty("clientTimeout").map { it as long }.getOrElse(10L))

// -Pscenarios=hud,map で、クライアントのゲームテストを名前の合うシナリオ（testkit の Scenario）だけにする
def scenarios = providers.gradleProperty("scenarios").getOrElse("")

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	// 1.0.0+26.3 のように MC バージョンを付ける
	version = "${mod_version}+${minecraft_version}"
	group = "${maven_group}.${project.name}"

	// Sodium・Iris は Modrinth の maven から入れる
	repositories {
		maven {
			name = "Modrinth"
			url = "https://api.modrinth.com/maven"
			content {
				includeGroup "maven.modrinth"
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

		// Iris + Sodium の環境で遊ぶ前提なので、開発で起動するとき（runClient・ゲームテスト）はどの mod にも入れる。jar には入らない。
		// -PnoSodium でバニラ描画のまま起動できる
		if (!project.hasProperty("noSodium")) {
			localRuntime "maven.modrinth:sodium:${sodium_version}"
			localRuntime "maven.modrinth:iris:${iris_version}"
		}

		// -PdistantHorizons で Distant Horizons も入れて起動する（併用の確認）。遠くの地形の生成と描画が重なるので、ふだんのテストには入れない
		if (project.hasProperty("distantHorizons")) {
			localRuntime "maven.modrinth:distanthorizons:${distanthorizons_version}"
		}
	}

	loom {
		splitEnvironmentSourceSets()

		mods {
			register(project.name) {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	// ゲームテストのソースセット（src/gametest、mod ID は <mod>-gametest）。サーバーとクライアントのどちらのゲームテストを走らせるかは
	// mods/<mod>/gradle.properties の server_gametest・client_gametest で決める（dev.py test も同じものを読む）。どちらもなければ作らない。
	// mod の build.gradle より先に作るので、mod の build.gradle では gametestCompileOnly などをそのまま使える
	def serverGametest = (project.findProperty("server_gametest") ?: "false").toString().toBoolean()
	def clientGametest = (project.findProperty("client_gametest") ?: "false").toString().toBoolean()
	if (serverGametest || clientGametest) {
		fabricApi {
			configureTests {
				createSourceSet = true
				modId = project.name + "-gametest"
				enableGameTests = serverGametest
				enableClientGameTests = clientGametest
			}
		}

		// ゲームテストから Distant Horizons の API（com.seibel.distanthorizons.api）を参照する。jar には入らない
		dependencies {
			gametestCompileOnly "maven.modrinth:distanthorizons:${distanthorizons_version}"
		}
	}

	// main・client・gametest のどのソースセットでも、fabric.mod.json と mixins.json のバージョンを gradle.properties から埋める
	tasks.withType(ProcessResources).configureEach {
		def props = [
			version          : project.version,
			minecraft_version: minecraft_version,
			loader_version   : loader_version,
			java_version     : java_version,
		]
		inputs.properties props

		filesMatching(["fabric.mod.json", "*.mixins.json"]) {
			expand props
		}
	}

	def javaVersion = java_version as int

	tasks.withType(JavaCompile).configureEach {
		it.options.release = javaVersion
	}

	java {
		withSourcesJar()

		sourceCompatibility = JavaVersion.toVersion(javaVersion)
		targetCompatibility = JavaVersion.toVersion(javaVersion)
	}

	// 全 mod のゲームテストで使う道具（testkit/）。各 mod の gametest に一緒にコンパイルする
	sourceSets.matching { it.name == "gametest" }.configureEach {
		java.srcDir(rootProject.file("testkit/java"))
	}

	tasks.matching { it.name == "runClientGameTest" }.configureEach {
		usesService(minecraftClients)
		timeout = clientTimeout
		systemProperty "testkit.scenarios", scenarios
		// Distant Horizons は java.awt.headless を false にするので、テストが失敗すると Fabric Loader のエラーの画面が開き、閉じるまで終わらない
		systemProperty "fabric.noGui", "true"
	}

	jar {
		def projectName = project.name
		inputs.property "projectName", projectName

		from(rootProject.file("LICENSE")) {
			rename { "${it}_$projectName" }
		}
	}
}
