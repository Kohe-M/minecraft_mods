import java.time.Duration

import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// 同時に起動する Minecraft のクライアント（runClientGameTest）の数。
// 全 mod を一度に起動すると、どれかが起動の途中で止まることがある。-PclientSlots=N で変えられる
abstract class MinecraftClients implements BuildService<BuildServiceParameters.None> {
}

def minecraftClients = gradle.sharedServices.registerIfAbsent("minecraftClients", MinecraftClients) {
	maxParallelUsages = providers.gradleProperty("clientSlots").map { it as int }.orElse(3)
}

// 起動の途中で止まったクライアントを待ち続けない。-PclientTimeout=分 で変えられる
def clientTimeout = Duration.ofMinutes(providers.gradleProperty("clientTimeout").map { it as long }.getOrElse(10L))

// -Pscenarios=hud,map で、クライアントのゲームテストを名前の合うシナリオ（testkit の Scenario）だけにする
def scenarios = providers.gradleProperty("scenarios").getOrElse("")

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	// 1.0.0+26.3 のように MC バージョンを付ける
	version = "${mod_version}+${minecraft_version}"
	group = "${maven_group}.${project.name}"

	dependencies {
		minecraft "com.mojang:minecraft:${minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	}

	loom {
		splitEnvironmentSourceSets()

		mods {
			register(project.name) {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	// main・client・gametest のどのソースセットでも、fabric.mod.json と mixins.json のバージョンを gradle.properties から埋める
	tasks.withType(ProcessResources).configureEach {
		def props = [
			version          : project.version,
			minecraft_version: minecraft_version,
			loader_version   : loader_version,
			java_version     : java_version,
		]
		inputs.properties props

		filesMatching(["fabric.mod.json", "*.mixins.json"]) {
			expand props
		}
	}

	def javaVersion = java_version as int

	tasks.withType(JavaCompile).configureEach {
		it.options.release = javaVersion
	}

	java {
		withSourcesJar()

		sourceCompatibility = JavaVersion.toVersion(javaVersion)
		targetCompatibility = JavaVersion.toVersion(javaVersion)
	}

	// 全 mod のゲームテストで使う道具（testkit/）。各 mod の gametest に一緒にコンパイルする
	sourceSets.matching { it.name == "gametest" }.configureEach {
		java.srcDir(rootProject.file("testkit/java"))
	}

	tasks.matching { it.name == "runClientGameTest" }.configureEach {
		usesService(minecraftClients)
		timeout = clientTimeout
		systemProperty "testkit.scenarios", scenarios
	}

	jar {
		def projectName = project.name
		inputs.property "projectName", projectName

		from(rootProject.file("LICENSE")) {
			rename { "${it}_$projectName" }
		}
	}
}
