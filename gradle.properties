# JAVA_HOME が古い JDK だと、デーモンの既定の文字コードが OS のもの（Windows では MS932）になり、
# Loom が jori の fabric.mod.json に同梱の一覧を書き足すときに日本語が化ける
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Minecraft バージョンセット（https://fabricmc.net/develop）
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.0+26.3
java_version=25

# MC バージョンごとに変わる依存 mod
sodium_version=mc26.3-0.9.2-fabric
iris_version=1.11.7+26.3-fabric
distanthorizons_version=3.3.4-26.3

maven_group=com.omuraisu
