pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'minecraft_mods'

include 'fullbright', 'minimap', 'refill', 'sorter', 'timber', 'xray', 'zoom'

// 実体は mods/ の下。タスク名は :xray:runClient のまま
rootProject.children.each { it.projectDir = file("mods/${it.name}") }
